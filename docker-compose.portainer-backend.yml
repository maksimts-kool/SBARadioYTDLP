services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: ${REDIS_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${REDIS_HEALTHCHECK_TIMEOUT:-3s}
      retries: ${REDIS_HEALTHCHECK_RETRIES:-5}
      start_period: ${REDIS_HEALTHCHECK_START_PERIOD:-10s}

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS}
      APP_ALLOWED_ORIGIN_REGEX: ${APP_ALLOWED_ORIGIN_REGEX:-}
      APP_TEMP_ROOT: ${APP_TEMP_ROOT:-/tmp/sbaradio-ytdlp}
      APP_MAX_PLAYLIST_ITEMS: ${APP_MAX_PLAYLIST_ITEMS:-50}
      APP_MAX_DURATION_SECONDS: ${APP_MAX_DURATION_SECONDS:-14400}
      APP_MAX_ACTIVE_JOBS: ${APP_MAX_ACTIVE_JOBS:-1}
      APP_CLEANUP_AFTER_SECONDS: ${APP_CLEANUP_AFTER_SECONDS:-3600}
      APP_YTDLP_COOKIE_FILE: ${APP_YTDLP_COOKIE_FILE:-/cookies/youtube.txt}
      APP_YTDLP_COOKIES_FROM_BROWSER: ${APP_YTDLP_COOKIES_FROM_BROWSER:-}
      APP_REDIS_URL: ${APP_REDIS_URL:-redis://redis:6379/0}
      APP_REDIS_HEALTHCHECK_TIMEOUT_SECONDS: ${APP_REDIS_HEALTHCHECK_TIMEOUT_SECONDS:-1}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-admin}
      APP_ADMIN_SESSION_TTL_SECONDS: ${APP_ADMIN_SESSION_TTL_SECONDS:-43200}
    volumes:
      - ${YTDLP_COOKIE_FILE_HOST_PATH:-/opt/sbaradio-ytdlp/youtube.txt}:/cookies/youtube.txt
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3).read()\"",
        ]
      interval: ${BACKEND_HEALTHCHECK_INTERVAL:-30s}
      timeout: ${BACKEND_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${BACKEND_HEALTHCHECK_RETRIES:-3}
      start_period: ${BACKEND_HEALTHCHECK_START_PERIOD:-30s}

volumes:
  redis-data:
