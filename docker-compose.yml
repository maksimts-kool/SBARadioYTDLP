services:
  backend:
    build:
      context: ./backend
    environment:
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      APP_ALLOWED_ORIGIN_REGEX: ${APP_ALLOWED_ORIGIN_REGEX:-}
      APP_TEMP_ROOT: ${APP_TEMP_ROOT:-/tmp/sbaradio-ytdlp}
      APP_MAX_PLAYLIST_ITEMS: ${APP_MAX_PLAYLIST_ITEMS:-50}
      APP_MAX_DURATION_SECONDS: ${APP_MAX_DURATION_SECONDS:-14400}
      APP_MAX_ACTIVE_JOBS: ${APP_MAX_ACTIVE_JOBS:-1}
      APP_CLEANUP_AFTER_SECONDS: ${APP_CLEANUP_AFTER_SECONDS:-3600}
      APP_YTDLP_COOKIE_FILE: ${APP_YTDLP_COOKIE_FILE:-/cookies/youtube.txt}
      APP_YTDLP_COOKIES_FROM_BROWSER: ${APP_YTDLP_COOKIES_FROM_BROWSER:-}
    volumes:
      - ./cookies:/cookies
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE: /api
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
